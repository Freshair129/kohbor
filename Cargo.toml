[workspace]
resolver = "2"
members = ["crates/kohbor-gsi", "crates/kohbor-gsi-capture", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.96"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.2"
base64 = "0.22"
tiny_http = "0.12"

[profile.release]
lto = "thin"
codegen-units = 1
