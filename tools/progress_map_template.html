<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kohbor — Mission Control</title>
<style>
:root{color-scheme:dark;--bg:#080c0f;--bg2:#0d1317;--card:rgba(255,255,255,.035);--card2:rgba(255,255,255,.06);--line:rgba(255,255,255,.09);--fg:#e8eef0;--muted:#8796a0;

:root[data-theme=light]{color-scheme:light;--bg:#eef3f5;--bg2:#e6edf0;--card:#ffffff;--card2:#f5f9fa;--line:rgba(15,30,40,.13);--fg:#14202a;--muted:#566774;
--acc:#0b8f63;--acc2:#6d4bd0;--glow:rgba(13,159,110,.10);--shadow:0 6px 22px rgba(20,40,50,.10);--rail:#f9fbfc;
--s-verified:#0b8f63;--s-built:#2563b8;--s-progress:#b86a00;--s-designed:#6d4bd0;--s-notstarted:#5d6b7a;--s-blocked:#c0262d;--s-unknown:#5d6b7a}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(900px 500px at 8% -8%,var(--glow),transparent 60%),radial-gradient(700px 420px at 100% 100%,rgba(167,139,250,.07),transparent 60%),var(--bg);color:var(--fg);
font:13px/1.4 "Prompt","Leelawadee UI","Noto Sans Thai",Tahoma,"Segoe UI",system-ui,sans-serif;display:grid;grid-template-rows:56px minmax(0,1fr) 28px;grid-template-columns:auto minmax(0,1fr);

.mono{font-family:Consolas,"Cascadia Mono","SF Mono",monospace}
button{font:inherit;color:inherit;cursor:pointer}
/* top bar */
#top{grid-area:top;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--card2),transparent);backdrop-filter:blur(8px)}

#rail .lab{opacity:0;transition:opacity .1s}#rail.open .lab{opacity:1}

.view.on{display:flex}

.card .body{padding:6px 16px 12px;overflow:auto;min-height:0;flex:1}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;flex:none}
.stat{padding:12px 16px;display:flex;justify-content:space-between;gap:8px;min-height:86px}
.stat .l{color:var(--muted);font-size:11.5px}.stat .v{font-size:26px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}.stat .s{font-size:11px;color:var(--muted);margin-top:1px}
.stat svg.i{color:var(--acc);flex:none}
.grid3{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,3fr) minmax(0,4fr);gap:12px;flex:1;min-height:0}
.col{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
.col>.card{flex:1}

.row{display:grid;grid-template-columns:150px minmax(0,1fr) 34px;gap:8px;align-items:center;padding:6px 0;cursor:pointer;border-radius:6px}
.row:hover{background:var(--card2)}
.row .n{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--card2)}.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px;cursor:pointer}.legend b{color:var(--fg);font-weight:600}
.dot{width:9px;height:9px;border-radius:3px;background:var(--sc);display:inline-block;flex:none}
.li{display:flex;gap:8px;padding:6px 4px;border-bottom:1px dashed var(--line);cursor:pointer;align-items:flex-start}.li:hover{background:var(--card2)}
.li .tx{min-width:0;flex:1}.li .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.li .q{color:var(--muted);font-size:11.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge{font-size:10px;border-radius:5px;padding:0 5px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.p0{background:var(--s-blocked);border-color:var(--s-blocked);color:#fff;font-weight:700}
.s-verified{--sc:var(--s-verified)}.s-built{--sc:var(--s-built)}.s-progress{--sc:var(--s-progress)}.s-designed{--sc:var(--s-designed)}.s-notstarted{--sc:var(--s-notstarted)}.s-blocked{--sc:var(--s-blocked)}.s-unknown{--sc:var(--s-unknown)}
.tag{display:inline-flex;align-items:center;gap:5px;border:1px solid color-mix(in srgb,var(--sc) 50%,transparent);background:color-mix(in srgb,var(--sc) 14%,transparent);color:var(--sc);border-radius:999px;padding:0 9px;font-size:11px;white-space:nowrap}
.tag.dash{border-style:dashed}

.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex:none}
.fchip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-left:4px solid var(--sc);background:var(--card);border-radius:8px;padding:3px 9px;font-size:12px}

input[type=search],select{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:4px 10px;font:inherit;min-width:0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 10px}.btn:hover{border-color:var(--acc)}
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;flex:1;min-height:0}
#tree{position:relative;overflow:auto;padding:10px}#canvas{position:relative}
svg#links{position:absolute;left:0;top:0;pointer-events:none}svg#links path{fill:none;stroke:var(--line);stroke-width:1.6}
.node{position:absolute;height:34px;border:1px solid var(--line);border-left:5px solid var(--sc);border-radius:9px;background:var(--card2);background:color-mix(in srgb,var(--sc) 11%,var(--card2));display:flex;align-items:center;gap:6px;padding:0 8px;cursor:pointer;overflow:hidden;white-space:nowrap;user-select:none}
.node:hover{border-color:var(--fg)}.node.sel{outline:2px solid var(--acc);outline-offset:1px}.node.dim{opacity:.25}.node.hit{box-shadow:0 0 0 2px var(--s-progress)}
.node.s-unknown{border-style:dashed;border-left-style:solid}
.node .g{color:var(--sc);font-weight:700;width:14px;text-align:center;flex:none}.node .l{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.node .bd{font-size:11px;color:var(--muted);flex:none}.node .ms{font-size:10px;color:var(--muted);flex:none}
.node.root{font-weight:700;font-size:14px}.node.area{font-weight:600}
.bar{position:absolute;left:0;right:0;bottom:0;height:3px;display:flex}.bar i{display:block;height:100%}
#panel .body h4{margin:12px 0 4px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.why{background:var(--card2);border-left:4px solid var(--sc);padding:6px 9px;border-radius:8px;margin:6px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px}.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-word}
.path{font:11.5px Consolas,"Cascadia Mono",monospace;word-break:break-all;color:var(--fg)}.path.miss{color:var(--s-blocked)}a{color:inherit}
.small{font-size:11.5px;color:var(--muted)}
/* board */
.board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;flex:1;min-height:0}
.bcol{display:flex;flex-direction:column;min-height:0;border-radius:14px;border:1px solid var(--line);background:var(--card);border-top:3px solid var(--sc)}
.bcol>h3{margin:0;padding:10px 12px 6px;font-size:12.5px;display:flex;justify-content:space-between;gap:6px;flex:none}.bcol>h3 span{color:var(--sc)}
.bcol .cards{padding:0 8px 8px;overflow:auto;display:flex;flex-direction:column;gap:8px;min-height:0}
.bc{border:1px solid var(--line);border-radius:11px;background:var(--card2);padding:8px 10px;cursor:pointer}.bc:hover{border-color:var(--sc)}
.bc .h{display:flex;justify-content:space-between;gap:6px;font-weight:600;font-size:12px}.bc .h span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bc .it{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px}
/* tables */
table{border-collapse:collapse;width:100%;font-size:12px}th{position:sticky;top:0;background:var(--bg2);text-align:left;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);z-index:1}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}tr.r{cursor:pointer}tr.r:hover td{background:var(--card2)}
tr.det td{background:var(--card2);color:var(--muted)}tr.det b{color:var(--fg)}
.grid2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:12px;flex:1;min-height:0}
.tl{position:relative;margin-left:8px;padding-left:14px;border-left:2px solid var(--line)}.tl .e{position:relative;padding:3px 0 8px}.tl .e::before{content:"";position:absolute;left:-20px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc)}
/* footer */
#foot{grid-area:foot;display:flex;justify-content:space-between;gap:14px;align-items:center;padding:0 16px;border-top:1px solid var(--line);color:var(--muted);font-size:10.5px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-transform:uppercase}
#foot b{color:var(--acc);font-weight:600}
@media (max-width:1100px){.grid3,.grid2,.mapwrap{grid-template-columns:1fr}.board{grid-template-columns:repeat(4,minmax(0,1fr));overflow:auto}.stats{grid-template-columns:repeat(2,1fr)}.view{overflow:auto}}

function buildOverview(){const v=views.overview;const st=D.stats;
 head(v,"Overview","Command Control Center",[chip("generated "+fmtT(D.generated_at)),chip(D.totals.verified+" verified of "+Object.values(D.totals).reduce((a,b)=>a+b,0)+" items")]);
