[package]
name = "kohbor-desktop"
description = "Kohbor desktop host (Tauri v2): containment, game-state intake, runtime status."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "kohbor_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
kohbor-gsi = { path = "../../../crates/kohbor-gsi" }
kohbor-events = { path = "../../../crates/kohbor-events" }
kohbor-audio = { path = "../../../crates/kohbor-audio" }
kohbor-audio-native = { path = "../../../crates/kohbor-audio-native" }
kohbor-pack = { path = "../../../crates/kohbor-pack" }
kohbor-capture = { path = "../../../crates/kohbor-capture" }
kohbor-capture-native = { path = "../../../crates/kohbor-capture-native" }
kohbor-minimap-cv = { path = "../../../crates/kohbor-minimap-cv" }
kohbor-risk = { path = "../../../crates/kohbor-risk" }
tauri = { version = "=2.12.5", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
getrandom = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
tiny_http = { workspace = true }
socket2 = { version = "=0.6.5", default-features = false }

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
windows = { version = "=0.61.3", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
kohbor-audio-native = { path = "../../../crates/kohbor-audio-native", features = ["latency-probe"] }
kohbor-pack-author = { path = "../../../crates/kohbor-pack-author" }
jsonschema = { version = "=0.59.0", default-features = false }
