[package]
name = "kohbor-desktop"
description = "Kohbor desktop host (Tauri v2): containment, game-state intake, runtime status."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
demo = ["dep:kohbor-account"]
# In-app update check, download and install (UPDATE-001..004, docs/design/UPDATER.md).
updater = ["dep:tauri-plugin-updater"]
# Dev-only Kohbor Lab override reader (docs/design/KOHBOR-LAB.md). Not a default feature.
# `lab` implies `demo`: Lab's commands live in the demo/debug handler list, and its Test banner needs demo_trigger.
lab = ["demo", "kohbor-lab/lab"]

[lib]
name = "kohbor_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
kohbor-account = { path = "../../../crates/kohbor-account", optional = true }
kohbor-gsi = { path = "../../../crates/kohbor-gsi" }
kohbor-events = { path = "../../../crates/kohbor-events" }
kohbor-audio = { path = "../../../crates/kohbor-audio" }
kohbor-audio-native = { path = "../../../crates/kohbor-audio-native" }
kohbor-pack = { path = "../../../crates/kohbor-pack" }
kohbor-capture = { path = "../../../crates/kohbor-capture" }
kohbor-capture-native = { path = "../../../crates/kohbor-capture-native" }
kohbor-minimap-cv = { path = "../../../crates/kohbor-minimap-cv" }
kohbor-risk = { path = "../../../crates/kohbor-risk" }
kohbor-game-assets = { path = "../../../crates/kohbor-game-assets" }
kohbor-lab = { path = "../../../crates/kohbor-lab" }
flate2 = { workspace = true }
tauri = { version = "=2.12.5", features = ["tray-icon"] }
serde = { workspace = true }
serde_json = { workspace = true }
getrandom = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
tiny_http = { workspace = true }
socket2 = { version = "=0.6.5", default-features = false }
tauri-plugin-updater = { version = "=2.14.1", optional = true }

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
windows = { version = "=0.61.3", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Networking_WinHttp",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
kohbor-audio-native = { path = "../../../crates/kohbor-audio-native", features = ["latency-probe"] }
kohbor-pack-author = { path = "../../../crates/kohbor-pack-author" }
jsonschema = { version = "=0.59.0", default-features = false }
