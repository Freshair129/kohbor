[package]
name = "kohbor-gsi-capture"
description = "M0 capture spike: installs a spike-only GSI configuration and records redacted payloads to confirm GSI-INTAKE-SPEC assumptions A-1..A-9 and EVENT-AUDIO-SPEC E-1/E-2."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "kohbor-gsi-capture"
path = "src/main.rs"

[dependencies]
kohbor-gsi = { path = "../kohbor-gsi" }
serde_json = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
base64 = { workspace = true }
tiny_http = { workspace = true }

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
